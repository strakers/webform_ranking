# Attached conditionally by the element plugin based on ranking_style.
# Logic (pointer-events reorder engine, matrix rank-exclusivity handling,
# and the hidden-input sync layer for client-side #states) comes in a
# later pass.

element.matrix:
  js:
    js/webform_ranking.matrix.js: {}
  css:
    theme:
      css/webform_ranking.matrix.css: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupal.states
    # Provides the real, complete '.visually-hidden' class (with
    # '!important' and a proper clip-rect) that this element's live
    # region relies on for its own class of the same name — see
    # css/webform_ranking.matrix.css's docblock.
    - system/base

element.dragdrop:
  js:
    js/webform_ranking.dragdrop.js: {}
  css:
    theme:
      css/webform_ranking.dragdrop.css: {}
  dependencies:
    - core/drupal
    - core/once
    - core/drupal.states
    # Same '.visually-hidden' dependency as element.matrix — this
    # style's own live region uses the same class, and this library
    # never loads webform_ranking.matrix.css.
    - system/base

# Attached only to the element's config/admin form (see form() in the
# WebformElement plugin), not to rendered form output. Purely a UI
# convenience — see the field definitions and validateConfigurationForm()
# in the plugin class for why this never touches saved config.
element.itemsAdmin:
  js:
    js/webform_ranking.items_admin.js: {}
  dependencies:
    - core/drupal
    - core/once
    - core/jquery
    - core/drupal.dialog
    - core/drupalSettings
    # The condition-rows builder (GitHub issue #65) reuses this
    # library's CSS/JS (value autocomplete, trigger wiring) via matching
    # 'webform-states-table--*' classes — see initConditionBuilder() in
    # items_admin.js. Declared directly rather than relying on the
    # element-level "Conditions" tab (which also loads it) always being
    # present first.
    - webform/webform.element.states
